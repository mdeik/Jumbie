[package]
name = "plugin-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt", "macros", "io-std", "io-util"], optional = true }
anyhow = "1.0"
schemars = "1.2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
futures-util = "0.3"

[features]
server = ["tokio", "tracing-subscriber"]
