name: Install Linux system dependencies
description: Installs ffmpeg and build accelerators (sccache + lld) for the Linux backend
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        SCCACHE_VERSION="0.17.0"   # prebuilt musl build — same one used on dev machines

        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          ffmpeg \
          lld \
          clang

        # sccache prebuilt binary — apt's version is too old for current rustc.
        # Skip if already present with the pinned version.
        if ! (command -v sccache >/dev/null 2>&1 && sccache --version | grep -q "\b${SCCACHE_VERSION}\b"); then
          curl -fsSL -o /tmp/sccache.tar.gz \
            https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo mv /tmp/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          rm -rf /tmp/sccache.tar.gz /tmp/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl
        fi
        sccache --version

        # Route rustc through sccache and link native binaries with lld.
        # The [target.x86_64-unknown-linux-gnu] table does not match the wasm32
        # frontend target, so the trunk build is unaffected.
        mkdir -p "$HOME/.cargo"
        cat > "$HOME/.cargo/config.toml" <<'EOF'
        [build]
        rustc-wrapper = "sccache"

        [target.x86_64-unknown-linux-gnu]
        linker = "clang"
        rustflags = ["-C", "link-arg=-fuse-ld=lld"]
        EOF
        echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_MAX_SIZE=2G" >> "$GITHUB_ENV"
